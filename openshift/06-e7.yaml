apiVersion: apps/v1
kind: Deployment
metadata:
  name: e7-3157-20s
  namespace: otlp-repro
  labels:
    experiencia: e7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e7-3157-20s
  template:
    metadata:
      labels:
        app: e7-3157-20s
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/otlp-repro/repro-jvm-3157:latest
          env:
            - name: JOB_EVERY
              value: 20s
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://repro-collector.otlp-repro.svc:4317
            - name: QUARKUS_OTEL_RESOURCE_ATTRIBUTES
              value: service.name=e7-3.15.7-every-20s
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
---
