apiVersion: apps/v1
kind: Deployment
metadata:
  name: repro-jvm-3401-20s-t65
  namespace: otlp-repro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repro-jvm-3401-20s-t65
  template:
    metadata:
      labels:
        app: repro-jvm-3401-20s-t65
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/otlp-repro/repro-jvm-3401:latest
          env:
            - name: JOB_EVERY
              value: 20s
            - name: QUARKUS_OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: 65s
            - name: QUARKUS_OTEL_EXPORTER_OTLP_TIMEOUT
              value: 65s
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://repro-collector.otlp-repro.svc:4317
            - name: QUARKUS_OTEL_RESOURCE_ATTRIBUTES
              value: service.name=repro-3.40.1-jvm-every-20s-t65
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
